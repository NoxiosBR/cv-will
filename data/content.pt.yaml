    - name: |-
        Supervisor Regional Security Center
      location: "G4S for General Mills Brasil"
      date: "Out 2023 - Presente"
      description: |-
        - 3 fábricas, 2 centros de distribuição e 3 escritórios corporativos, garantindo a proteção de mais de 3.500 funcionários em México, Brasil e Porto Rico.
        - Responsável pela implementação de uma Central de Monitoramento e Inteligência com foco na proteção patrimonial das regionais, proteção de redes e na redução de custos para a companhia, liderando uma equipe de dois operadores e apoiando o desenvolvimento de tecnologias para as regionais do Brasil, México e Porto Rico. Atuação na gestão de projetos voltados à food safety e food defense, além da criação de soluções de tecnologias com o objetivo de reduzir gastos desnecessários e otimizar e automatizar processos operacionais.
  projects:
    - name: Artemis App
      date: "2023"
      techstack:
        name: "Power FX"
      description: >-
        Criação de uma solução para registrar incidentes identificados durante as rondas de fábrica, com foco em vulnerabilidades potenciais 
        relacionadas à Segurança e Defesa Alimentar. A ferramenta permitiu que os seguranças registrassem 
        oportunidades de melhoria encontradas durante as inspeções, gerando tickets individuais e relatórios 
        automatizados enviados aos gerentes de qualidade para monitoramento e tomada de decisões.
        
        Inspiração para o Nome do Projeto: A aplicação foi nomeada Ártemis em referência à deusa grega da caça. 
        O nome representa o propósito do aplicativo de "caçar" oportunidades de melhoria e identificar riscos potenciais durante 
        inspeções de fábrica, reforçando a missão de identificar proativamente vulnerabilidades e aprimorar os padrões de segurança alimentar.
    - name: Formulários automatizados
      date: "2023 - Presente"
      techstack:
        name: "Power Automate"
      description: >-
        Criação de formulários automatizados para otimizar processos internos, incluindo solicitações de tickets, 
        pesquisas de satisfação acionadas após fluxos de trabalho de aprovação e formulários de gestão de visitantes com fluxos internos 
        de aprovação da liderança. Essas soluções melhoraram a padronização dos processos, reduziram tarefas manuais e aumentaram a eficiência 
        no rastreamento e gerenciamento de solicitações.
    - name: EcoSocialHub
      date: "2025"
      techstack:
        name: "Flutter; React; NodeJS; MySQL"
      description: >-
        O projeto EcoSocialHub, um aplicativo acadêmico para Android focado em promover a conscientização ambiental e incentivar 
        práticas sustentáveis. O aplicativo oferecia uma plataforma digital onde os usuários podiam acessar conteúdos ambientais, compartilhar 
        iniciativas e se envolver com temas relacionados à sustentabilidade e ao envolvimento comunitário.
        Ao longo do projeto, contribuí para o processo de desenvolvimento de aplicações, incluindo design de interfaces, implementação de 
        recursos, integração de banco de dados, testes e depuração, adquirindo experiência prática em desenvolvimento de aplicações móveis e 
        engenharia de software.

